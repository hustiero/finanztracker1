<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>AI-Berater (Standalone-Dev)</title>
    <script type="module" crossorigin src="./assets/aiberater.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/aiberater.css">
  </head>
  <body class="bg-black">
    <div id="aiberater-root"></div>
    <script>
      // Standalone: mount mit embedded=false → App nutzt eigenen LoginScreen.
      window.addEventListener('DOMContentLoaded', () => {
        if (window.AIB) {
          window.AIB.mount({ embedded: false });
        }
      });
    </script>
  </body>
</html>
